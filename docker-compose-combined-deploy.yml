services:
  # Backend server
  qa-live-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: qa-live-server
    image: vibeimages.azurecr.io/qa-live/qa-live-server-combined:latest
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - SERVER_PORT=3007
      - LOG_LEVEL=INFO
    volumes:
      - ./server/src/data:/app/dist/data
    networks:
      - qa-live-network

  # Frontend web application for combined deployment
  qa-live-web:
    build:
      context: ./web
      dockerfile: Dockerfile-combined-deploy
    container_name: qa-live-web
    image: vibeimages.azurecr.io/qa-live/qa-live-web-combined:latest
    restart: unless-stopped
    ports:
      - "6174:80"  # Using port 6174 for combined deployment
    depends_on:
      - qa-live-server
    networks:
      - qa-live-network

networks:
  qa-live-network:
    driver: bridge

volumes:
  data:
    driver: local
