
services:
  # Backend server
  qa-live-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: qa-live-server
    image: vibeimages.azurecr.io/qa-live/qa-live-server-standalone:latest
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - SERVER_PORT=3007
      - LOG_LEVEL=INFO
    volumes:
      - ./server/src/data:/app/dist/data
    networks:
      - qa-live-network

  # Frontend web application
  qa-live-web:
    build:
      context: ./web
      dockerfile: Dockerfile-standalone
    container_name: qa-live-web
    image: vibeimages.azurecr.io/qa-live/qa-live-web-standalone:latest
    restart: unless-stopped
    ports:
      - "6173:80"  # Using port 6173 to match configuration
    depends_on:
      - server
    networks:
      - qa-live-network

networks:
  qa-live-network:
    driver: bridge

volumes:
  data:
    driver: local