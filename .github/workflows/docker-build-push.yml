name: Build and Push QA-Live Images

on:
  push:
    branches:
      - main
      - 'releases/*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_AccessKey }}" | docker login vibeimages.azurecr.io -u "vibeimages" --password-stdin || echo "Docker login failed. Check secrets or registry address."

      - name: Build and push Docker images
        run: |
          docker compose -f docker-compose.yml build
          docker tag vibeimages.azurecr.io/qa-live/qa-live-server:latest vibeimages.azurecr.io/qa-live/qa-live-server:$GITHUB_RUN_NUMBER
          docker tag vibeimages.azurecr.io/qa-live/qa-live-web:latest vibeimages.azurecr.io/qa-live/qa-live-web:$GITHUB_RUN_NUMBER
          docker push vibeimages.azurecr.io/qa-live/qa-live-server:latest
          docker push vibeimages.azurecr.io/qa-live/qa-live-server:$GITHUB_RUN_NUMBER
          docker push vibeimages.azurecr.io/qa-live/qa-live-web:latest
          docker push vibeimages.azurecr.io/qa-live/qa-live-web:$GITHUB_RUN_NUMBER